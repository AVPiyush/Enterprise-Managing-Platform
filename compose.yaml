services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: eap-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - .env

    depends_on:
      - postgres

    restart: unless-stopped

  postgres:
    image: postgres:16

    container_name: eap-postgres

    environment:
      POSTGRES_DB: eap
      POSTGRES_USER: eap_user
      POSTGRES_PASSWORD: ${piyush_eapdb}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  redis:
    image: redis:7

    container_name: eap-redis

    ports:
      - "6379:6379"

    restart: unless-stopped
volumes:
  postgres_data: